{% extends "propuesta/base.html" %}
{% load crispy_forms_tags %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="escenario-inicio">
  <h1 class="titulo-pantalla">Antes de seguir...</h1>
  <p class="subtitulo-pantalla">Ingresa tu usuario y contraseña para ver la propuesta.</p>

  <form method="post" novalidate style="width: 100%; max-width: 360px;">
    {% csrf_token %}
    {% crispy form %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="fila-acciones" style="justify-content: center;">
      <button type="submit" class="boton-principal">Entrar</button>
    </div>
  </form>
</div>
{% endblock %}

{% block js %}
<script>
(function () {
  const campoPassword = document.getElementById("id_password");
  if (!campoPassword) return;

  const envoltura = document.createElement("div");
  envoltura.className = "campo-password-envoltura";
  campoPassword.parentNode.insertBefore(envoltura, campoPassword);
  envoltura.appendChild(campoPassword);

  const boton = document.createElement("button");
  boton.type = "button";
  boton.className = "boton-ver-password";
  boton.setAttribute("aria-label", "Mostrar contraseña");
  boton.innerHTML = '<i class="fa-solid fa-eye"></i>';
  envoltura.appendChild(boton);

  boton.addEventListener("click", function () {
    const estaOculta = campoPassword.type === "password";
    campoPassword.type = estaOculta ? "text" : "password";
    boton.innerHTML = estaOculta
      ? '<i class="fa-solid fa-eye-slash"></i>'
      : '<i class="fa-solid fa-eye"></i>';
    boton.setAttribute("aria-label", estaOculta ? "Ocultar contraseña" : "Mostrar contraseña");
  });
})();
</script>
{% endblock %}
