{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Una propuesta{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>

<div class="lienzo">
  {% if paso %}
  <nav class="rastro" aria-label="Progreso hacia la cita">
    {% for n, etiqueta in pasos %}
      <div class="rastro-punto {% if n <= paso %}rastro-punto--activo{% endif %}">
        <span class="rastro-marca"><i class="fa-solid fa-heart"></i></span>
        <span class="rastro-etiqueta">{{ etiqueta }}</span>
      </div>
      {% if not forloop.last %}<span class="rastro-linea {% if n < paso %}rastro-linea--activa{% endif %}"></span>{% endif %}
    {% endfor %}
  </nav>
  {% endif %}

  <main class="contenedor">
    {% block contenido %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block js %}{% endblock %}
</body>
</html>
